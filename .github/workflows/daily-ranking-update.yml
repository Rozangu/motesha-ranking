name: Daily ranking update

on:
  schedule:
    # UTC 0:00 = 日本時間 9:00
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily increment script
        run: python3 scripts/daily_increment.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ranking.json
          git diff --staged --quiet || git commit -m "chore: daily ranking update"
          git push
